[project]
name = "weather-gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hariharan P R", email = "prhariharan2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",

    # Validation & configuration
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",

    # Authentication
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",

    # Database
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",

    # HTTP
    "httpx>=0.27",

    # Redis
    "redis>=5.0.3",

    # Google AI
    "google-genai>=1.2.0",

    # Translation & Speech
    "deep-translator>=1.11.4",
    "langdetect>=1.0.9",
    "gtts>=2.5.4",
    "pydub>=0.25.1",
    "speechrecognition>=3.17.0",

    # Agent layer (LangGraph/LangChain) and its model providers
    "langchain>=0.3.27",
    "langgraph>=0.6.7",
    "langchain-groq>=0.3.8",
    "langchain-google-genai>=2.1.12",

    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
[project.scripts]
weather-gpt = "weather_gpt.main:app"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

